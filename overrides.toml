# Per-package recipe fixes, keyed by R package name.
#   build, host, run   conda-forge match specs added to that recipe section
#   skip               reason the package is not built
#   makevars           lines added to the user Makevars, as { <subdir> = [lines] }
#   patches            files in patches/<Package>/ applied to the source
#   binary_relocation  files rattler-build relinks, as { <subdir> = false | [globs] }
#   env                variables exported by build.sh, as { NAME = "value" }
#
# [package.ExamplePkg]
# host = ["gsl", "libxml2 >=2.12"]
#
# [package."BSgenome.Example.UCSC.xx1"]
# skip = "source tarball exceeds the runner disk"

