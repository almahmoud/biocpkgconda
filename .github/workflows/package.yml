name: Package

on:
  workflow_call:
    inputs:
      target:
        description: <subdir>/<Package> to build
        required: true
        type: string
      runner:
        description: Runner label for the build job
        required: true
        type: string

permissions: {}

jobs:
  # Runs the package's build scripts, so it has read-only package access and logs out of GHCR before they run.
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.package.outputs.sha256 }}
      filename: ${{ steps.package.outputs.filename }}
      failed: ${{ steps.recipe.outcome == 'failure' || steps.build.outcome == 'failure' || steps.package.outcome == 'failure' }}
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check target
        id: target
        run: |
          pattern='^(noarch|linux-64|linux-aarch64|osx-64|osx-arm64|win-64)/[A-Za-z][A-Za-z0-9.]*$'
          if [[ ! "$TARGET" =~ $pattern ]]; then
            echo "::error::invalid target; expected <subdir>/<Package>"
            exit 1
          fi
          subdir="${TARGET%%/*}"
          echo "subdir=$subdir" >> "$GITHUB_OUTPUT"
          echo "name=$subdir-${TARGET#*/}" >> "$GITHUB_OUTPUT"
      # Data packages can exceed the free space of a fresh Linux runner.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Linux builds run in the builder image; other runners build on the host.
      - name: Find builder image
        id: builder
        if: runner.os == 'Linux'
        run: python -m biocpkgconda builder-image
      - name: Pull builder image
        if: runner.os == 'Linux'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$BUILDER_IMAGE"
      - name: Install Python dependencies
        if: runner.os != 'Linux'
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Install rattler-build
        if: runner.os != 'Linux'
        run: |
          python -m biocpkgconda install-rattler-build --dest "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fetch conda-forge pinning
        if: runner.os != 'Linux'
        run: python -m biocpkgconda fetch-pinning --dest "$RUNNER_TEMP/cbc"
      # The container sees the checkout read-only and can write to work/ only.
      - name: Render recipe
        id: recipe
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p work
            docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
              -v "$PWD:/work:ro" -v "$PWD/work:/work/work" -w /work "$BUILDER_IMAGE" \
              python -m biocpkgconda recipe --target="$TARGET" --out work/recipe --cache work/cache
          else
            python -m biocpkgconda recipe --target="$TARGET" --out work/recipe --cache "$RUNNER_TEMP/cache"
          fi
      # Uploaded before the build, which can write to work/.
      - name: Upload recipe
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recipe-${{ steps.target.outputs.name }}
          path: work/recipe
          if-no-files-found: ignore
          retention-days: 14
      # Ends before the job timeout, so a build that runs out of time counts as a failed build.
      - name: Build
        id: build
        timeout-minutes: 240
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            status=0
            docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
              -v "$PWD:/work:ro" -v "$PWD/work:/work/work" -w /work "$BUILDER_IMAGE" \
              python -m biocpkgconda build --recipe work/recipe --output-dir work/out \
                --variant-config /opt/conda-build-config/conda_build_config.yaml \
                --markdown-summary work/summary.md || status=$?
            if [ -f work/summary.md ] && [ ! -L work/summary.md ]; then
              cat work/summary.md >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$status"
          else
            python -m biocpkgconda build --recipe work/recipe --output-dir work/out \
              --variant-config "$RUNNER_TEMP/cbc/conda_build_config.yaml" \
              --markdown-summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Hash package
        id: package
        env:
          SUBDIR: ${{ steps.target.outputs.subdir }}
        run: |
          shopt -s nullglob
          files=(work/out/"$SUBDIR"/*.conda)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected one .conda file in work/out/$SUBDIR, found ${#files[@]}"
            exit 1
          fi
          filename=${files[0]##*/}
          # The build chose this name, and a name holding a newline would add lines to $GITHUB_OUTPUT.
          if [[ ! "$filename" =~ ^[A-Za-z0-9._+!-]+\.conda$ ]]; then
            echo "::error::the build wrote a package whose file name is not a package file name"
            exit 1
          fi
          # The build wrote work/out, so a link there could point at any file on the runner.
          if [ -L work/out ] || [ -L "work/out/$SUBDIR" ] || [ -L "${files[0]}" ] || [ ! -f "${files[0]}" ]; then
            echo "::error::${files[0]} is not a regular file"
            exit 1
          fi
          sha256=$(python -I -c 'import hashlib, sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "${files[0]}")
          {
            echo "path=${files[0]}"
            echo "filename=$filename"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ steps.target.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      rejected: ${{ steps.verify.outcome == 'failure' || steps.check.outcome == 'failure' }}
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      # setup-oras v2.0.1 lists ORAS releases up to 1.3.3.
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/package
      - name: Verify package
        id: verify
        env:
          FILENAME: ${{ needs.build.outputs.filename }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          filename_pattern='^[A-Za-z0-9._+!-]+\.conda$'
          sha256_pattern='^[0-9a-f]{64}$'
          if [[ ! "$FILENAME" =~ $filename_pattern ]] || [[ ! "$SHA256" =~ $sha256_pattern ]]; then
            echo "::error::the build job reported an invalid package file name or sha256"
            exit 1
          fi
          if [ "$(ls -A "$RUNNER_TEMP/package")" != "$FILENAME" ]; then
            echo "::error::the package artifact does not hold exactly $FILENAME"
            exit 1
          fi
          echo "$SHA256  $RUNNER_TEMP/package/$FILENAME" | sha256sum --check --strict
      - name: Check package
        id: check
        env:
          FILENAME: ${{ needs.build.outputs.filename }}
        run: python -m biocpkgconda check-package --target="$TARGET" --cache "$RUNNER_TEMP/cache" "$RUNNER_TEMP/package/$FILENAME"
      - name: Publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILENAME: ${{ needs.build.outputs.filename }}
        run: python -m biocpkgconda publish --target="$TARGET" --cache "$RUNNER_TEMP/cache" "$RUNNER_TEMP/package/$FILENAME"

  # Counts failures of the package itself. Artifact and registry errors leave it for the next sync to retry.
  record-failure:
    needs: [build, publish]
    if: ${{ failure() && (needs.build.outputs.failed == 'true' || needs.publish.outputs.rejected == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Record failure
        env:
          TARGET: ${{ inputs.target }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m biocpkgconda fail --target="$TARGET" --run-url="$RUN_URL" --cache "$RUNNER_TEMP/cache"
